name: iOS Build (Experimental)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Validate iOS release build
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build iOS release without code signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/ios/unsigned/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/Runner.app
          cd build/ios/unsigned
          zip -qry QuantoPosso.ipa Payload
          test -f QuantoPosso.ipa
          ls -lh .

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: quanto-posso-ios-unsigned
          path: build/ios/unsigned/QuantoPosso.ipa
          if-no-files-found: error
