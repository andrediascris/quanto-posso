name: iOS Build (Experimental)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Validate iOS release build
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build iOS release without code signing
        run: flutter build ios --release --no-codesign
